name: Build Boards

on:
  push:
    branches:
      - main
      - dev
      - 'dev-*'
      - ci/* # for ci test
  pull_request:
    branches:
      - main
      - 'dev-*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - id: list
        name: Get all variant list
        run: |
          echo "all_variants=$(python scripts/build.py --list-boards --json)" >> $GITHUB_OUTPUT

      - id: select
        name: Select variants based on changes
        env:
          ALL_VARIANTS: ${{ steps.list.outputs.all_variants }}
        run: |
          EVENT_NAME="${{ github.event_name }}"

          # push 或 release，编译全部变体
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "release" ]]; then
            echo "variants=$ALL_VARIANTS" >> $GITHUB_OUTPUT
            exit 0
          fi

          # pull_request 场景
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE_SHA, Head: $HEAD_SHA"

          CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA || true)
          echo -e "Changed files:\n$CHANGED"

          SELECTED=$(printf '%s\n' "$CHANGED" | python scripts/build.py --select-changed)
          echo "variants=$SELECTED" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-idf

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaoling_${{ matrix.name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

  compatibility:
    name: Representative builds
    strategy:
      matrix:
        idf:
          - v6.1.1
        board:
          - atk-dnesp32s3-box
          - esp32s3-korvo2-v3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:${{ matrix.idf }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-idf

      - name: Build current board
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }}

  release:
    name: Publish release
    needs: [ build, compatibility ]
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/xiaoling/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: xiaoling_*

      - name: Prepare release assets
        run: |
          mkdir -p assets
          for dir in xiaoling_*; do
            board=${dir#xiaoling_}
            board=${board%_*}
            ref=${{ github.ref_name }}
            ref=${ref#xiaoling/}
            pushd $dir
            zip -r9 "../assets/xiaoling_${board}_${ref}.zip" *.bin
            popd
          done

      - name: Upload release assets
        uses: svenstaro/upload-release-action@2.11.2
        with:
          file: assets/*
          file_glob: true
          make_latest: false
