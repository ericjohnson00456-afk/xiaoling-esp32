name: Build Boards

on:
  push:
    branches:
      - main
      - dev
      - 'dev-*'
      - ci/* # for ci test
      - codex/**
  pull_request:
    branches:
      - main
      - dev
      - 'dev-*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
    name: Determine build batches
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      reused_run: ${{ steps.plan.outputs.reused_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 7

  build:
    name: Build ${{ matrix.id }}
    needs: prepare
    if: needs.prepare.outputs.count != '0' && needs.prepare.outputs.reused_run == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: espressif/idf:v6.1.1
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 256M
      CCACHE_COMPILERCHECK: content
      IDF_COMPONENT_CACHE_PATH: ${{ github.workspace }}/.cache/components
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-idf
      - name: Restore component downloads
        id: components
        uses: actions/cache/restore@v4
        with:
          path: .cache/components
          key: idf6-components-${{ matrix.target }}-${{ hashFiles('**/idf_component.yml', '.github/actions/setup-idf/action.yml') }}
      - name: Restore compiled objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: .cache/ccache
          key: idf6-ccache-${{ matrix.id }}-${{ hashFiles('.github/actions/setup-idf/action.yml') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            idf6-ccache-${{ matrix.id }}-${{ hashFiles('.github/actions/setup-idf/action.yml') }}-
      - name: Build batch
        shell: bash
        env:
          CI_VARIANTS: ${{ toJson(matrix.variants) }}
          CI_SHARD: ${{ matrix.id }}
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.git"
          ccache --zero-stats
          python scripts/ci.py build "$CI_SHARD"
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - name: Save compiled objects
        if: ${{ !cancelled() && steps.objects.outputs.cache-primary-key != '' && steps.objects.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Save component downloads
        if: ${{ !cancelled() && steps.components.outputs.cache-primary-key != '' && steps.components.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/components
          key: ${{ steps.components.outputs.cache-primary-key }}
      - name: Upload firmware and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}
          path: ci-artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  result:
    name: CI result
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          PREPARE: ${{ needs.prepare.result }}
          BUILD: ${{ needs.build.result }}
          COUNT: ${{ needs.prepare.outputs.count }}
          REUSED: ${{ needs.prepare.outputs.reused_run }}
        run: |
          test "$PREPARE" = success
          if [ "$COUNT" != 0 ] && [ -z "$REUSED" ]; then
            test "$BUILD" = success
          fi

  release:
    permissions:
      contents: write
      actions: read
    name: Publish release
    needs: [prepare, result]
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/xiaoling/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.reused_run || github.run_id }}
          pattern: firmware-*
          path: downloaded
          merge-multiple: true

      - name: Validate complete firmware set
        run: python3 scripts/ci.py release-assets downloaded assets

      - name: Upload release assets
        uses: svenstaro/upload-release-action@2.11.2
        with:
          file: assets/*
          file_glob: true
          make_latest: false
